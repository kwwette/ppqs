name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate publication without uploading to PyPI'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}

    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialise project
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            python -m pip install --upgrade pip
            python -m pip install .
            ppqs init

      - name: Perform linting checks
        run: |
          ppqs lint

      - name: Build project
        run: |
          ppqs build

      - name: Run tests
        run: |
          ppqs test --no-cov

      - name: Validate metadata
        run: |
          twine check dist/*

      - name: Attest build
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
